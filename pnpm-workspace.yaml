# pnpm workspace — the published packages of the effect-web family.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the preferenceflow application's catalog
# (the freshest of the three consuming applications — website, gardeneria,
# preferenceflow) wherever the two overlap (effect, vite-plus, the
# TypeScript 6/7 pair, fallow) — the apps consume these libraries, so the
# libraries build against exactly what they run.
packages:
  - packages/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND RUNS every JSDoc `@example` (the `docgen` task); needs `tsx`
  # and a TypeScript JS API — the TS6 alias below satisfies its peer.
  "@effect/docgen": ^4.0.6
  "@effect/language-service": ^0.87.5
  # Optional peer of @thomasfosterau/effect-web: only the `./browser` and
  # `./testing` entries import it (its `Permissions`, `Clipboard` and
  # `Geolocation` services). Exact, in lockstep with `effect` below: its own
  # peer is `effect: ^<its version>`.
  "@effect/platform-browser": 4.0.6
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.55.0 ships against typescript 7.0.2 and
  # 7.1.0-dev.20261019.1) and with the `oxlint` and `oxlint-tsgolint` that
  # `vite-plus` pulls in (0.63.0 supports oxlint 1.88.0 – 1.90.0 and
  # tsgolint 7.0.2004 / 7.0.2005, on native typescript 7.0.2; vite-plus 1.4.0
  # carries oxlint 1.89.0 and tsgolint 7.0.2004).
  # Each @effect/tsgo release hard-errors (UnsupportedTargetPackageVersionError)
  # on any other component version, failing `pnpm install` itself. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.63.0
  # The Effect lint rules (`effect/*`, the `anti-slop` rules included), loaded
  # by vite-plus's oxlint as a JS plugin through `configs.recommended` in
  # vite.config.ts. Rides in Dependabot's `toolchain` group with the oxlint
  # it loads into. It depends on `effect` 4.1.0 exactly, but the `effect`
  # override below forces it onto the workspace singleton, which it lints
  # fine against.
  "@enfect/oxlint": ^0.9.0
  # Optional peer of @thomasfosterau/effect-web: only the `./negotiate` entry
  # imports it (the JSON:API §5/§6 media-type rules are adopted from its
  # `Middleware`, never re-implemented here).
  "@thomasfosterau/effect-jsonapi": ^0.19.0
  # Peer of @thomasfosterau/effect-robots: the robots.txt line grammar is an
  # effect-parse parser, decoded through its `ParserSchema` (effect-web#113).
  "@thomasfosterau/effect-parse": ^0.3.0
  "@types/node": ^26.6.5
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.0.6
  fallow: 3.37.0
  # Runs docgen's compiled examples.
  tsx: ^4.23.15
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler, @effect/docgen) stay on TS6 while native `tsc`
  # type-checks. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 1.1.0 carries oxlint 1.87.0
  # on vitest 5.0.3, 1.2.0 carries 1.88.0 on vitest 5.0.4, 1.3.0 carries
  # 1.88.0 on vitest 5.0.5, 1.4.0 carries 1.89.0 (oxfmt 0.74.0, tsgolint
  # 7.0.2004) on vitest 5.0.5. `vite` is the same release under its aliased core
  # package, and `vitest` must match vite-plus's exact pin (1.4.0 → 5.0.5)
  # because the `vitest: "catalog:"` override forces every resolution to the
  # catalog singleton.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.115` peer would reject a consumer on rc.116). `pnpm publish`
# replaces `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    # Its 4.0.0 is the first release on the stable `effect` line this
    # family's `effect` floor (rc.118) already admits.
    "@effect/platform-browser": ">=4.0.0"
    "@thomasfosterau/effect-jsonapi": ">=0.16.1"
    # Caret, not `>=`: on 0.x a minor release may break the combinator API
    # the robots grammar is written against.
    "@thomasfosterau/effect-parse": ^0.3.0
    # rc.118 removed every `effect/unstable/*` export path (now `effect/http`,
    # `effect/http-api`, `effect/sql`, ...), so the published dist imports
    # paths that do not exist on anything older: the floor is rc.118
    # (effect-web#31; website#2015, website#2059).
    effect: ">=4.0.0-rc.118"

overrides:
  # undici <8.12.2 — GHSA-xjj6-f33q-929c (high): an unhandled error on a
  # response with excessive content-encodings is a denial of service
  # (#170). Reached transitively (@effect/platform-node > undici), whose
  # range admits the fix but whose lockfile resolution stayed below it.
  # Drop once that resolution reaches >=8.12.2 on its own.
  undici: ^8.12.2
  # vite-plus's managed overrides (`vp migrate` writes the `@*` keys under
  # pnpm): every `vite` resolves to the vite-plus core alias and every
  # `vitest` to the one vite-plus pins.
  "vite@*": "catalog:"
  "vitest@*": "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149, relaxed to 8 hours on
# 2026-10-30): hold newly published versions for 8 hours (unit: MINUTES)
# before pnpm will install them. Dependabot's `cooldown` (whole days only) is
# set to 1 day, longer than this, so it never proposes a version pnpm would
# still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
